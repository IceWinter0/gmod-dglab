[workspace]
members = ["crates/common", "crates/collector", "crates/diagnostic", "crates/controller", "desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/IceWinter0/gmod-dglab"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.28"

[profile.release]
panic = "abort"
strip = "debuginfo"
